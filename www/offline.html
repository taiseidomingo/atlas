<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS – offline</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fd;color:#0f172a;font-family:system-ui,sans-serif;text-align:center;padding:24px}
h1{margin:0 0 8px;font-size:22px}p{margin:0 0 20px;color:#64748b;max-width:320px}
button{background:#2433c4;color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:16px;font-weight:600}
</style></head><body><div>
<h1>Can't reach ATLAS</h1>
<p>Check your internet connection (or that the development server is running), then try again.</p>
<button id="retry">Try again</button></div>

<script>document.getElementById("retry").onclick=function(){location.replace(window.ATLAS_SERVER_URL||"/")};</script>
